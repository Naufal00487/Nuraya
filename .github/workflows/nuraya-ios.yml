name: Nuraya iOS
on:
  push:
    branches: [feature/nuraya-ios-xr]
    paths: ['ios/**', '.github/workflows/nuraya-ios.yml', 'app/src/main/assets/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuraya-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Package unchanged Android content
        run: python3 ios/scripts/prepare_assets.py
      - name: Test Quran references, audio queues and recitation comparison
        working-directory: ios/NurayaCore
        run: swift test
      - name: Install build tools
        run: brew install xcodegen cmake ninja ffmpeg
      - name: Generate Xcode project and native resources
        run: bash ios/scripts/prepare_macos.sh
      - name: Build iOS simulator app
        working-directory: ios
        run: xcodebuild -project Nuraya.xcodeproj -scheme Nuraya -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone package
        run: bash ios/scripts/build_unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nuraya-iOS-XR-unsigned
          path: ios/.build/Nuraya-iOS-XR-unsigned.ipa
          retention-days: 14
